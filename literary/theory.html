<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.ico" />

    <link rel="stylesheet" href="/src/styles/var.css" />
    <link rel="stylesheet" href="/src/styles/reset.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout/site-header.css" />
    <link rel="stylesheet" href="/src/styles/layout/main.css" />
    <link rel="stylesheet" href="/src/styles/typography.css" />
    <link rel="stylesheet" href="/src/styles/pages/theory.css" />

    <script type="module" src="/index.js"></script>
    <title>Literary Theory・gildrom.com</title>
  </head>
  <body>
    <header id="site-header"></header>
    <main>
      <article>
        <h1>Literary Theory, Analysis, &amp; Criticism</h1>
        <form title="Theory" id="search-box"></form>
        <p id="jumper">
          <a href="#primary">Primary Texts</a> <span>・</span>
          <a href="#secondary">Secondary Texts</a> <span>・</span>
          <a href="#applied">Applied Criticism</a> <span>・</span>
          <a href="#related">Related Texts</a>
        </p>
        <section id="primary">
          <div>
            <h2>Primary Texts</h2>
            <hr />
            <!--original, foundational theoretical texts-->
          </div>
        </section>
        <section id="secondary">
          <div>
            <h2>Secondary Texts</h2>
            <hr />
            <!--comment on, explain, apply, or critique primary texts-->
          </div>
        </section>
        <section id="applied">
          <div>
            <h2>Applied Criticism</h2>
            <hr />
            <!--commenting on and deploying a theoretical framework-->
          </div>
        </section>
        <section id="related">
          <div>
            <h2>Related Texts</h2>
            <hr />
            <!--provide context but not directly about literary theory-->
          </div>
        </section>
      </article>
    </main>

    <script>
      const searchBox = document.querySelector("#search-box");
      const placeholderName = searchBox.title.toUpperCase();
      searchBox.innerHTML = `
        <search>
          <input
            class="Departure"
            type="search"
            id="search"
            name="filter"
            autocomplete="off"
            placeholder="${placeholderName}・Filter Bibliography" />
          <input
            type="reset"
            id="clear"
            value="X"
            title="clear search"
            aria-label="clear search" />
        </search>`;
    </script>

    <script>
      (async () => {
        const works = await fetch("/src/json/theory.json").then((response) =>
          response.json(),
        );

        const sections = {
          primary: document.querySelector("#primary"),
          secondary: document.querySelector("#secondary"),
          applied: document.querySelector("#applied"),
          related: document.querySelector("#related"),
        };

        Object.entries(works)
          .sort(([, a], [, b]) => a.year - b.year)
          .forEach(([id, work]) => {
            if (!work.section || !sections[work.section]) {
              return;
            }
            const entry = document.createElement("details");
            entry.id = id;
            entry.classList.add("card");
            entry.innerHTML = `
              <summary>
                <div class="top-row">
                  <span class="authors">${work.authors.join(", ")}</span> ·
                  <span class="year">${work.year}</span>
                </div>
                <div class="title">${work.title}</div>
                <div class="tags">
                  <mark class="lang">${work.tags[0]}</mark>
                  <mark class="type">${work.tags[1]}</mark>
                  <mark class="school">${work.tags[2]}</mark>
                </div>
              </summary>
              <div class="entry-body">
                <details class="argument" open>
                  <summary>Context & Argument <i>+</i></summary>
                  <div>
                    <p class="summary">${work.summary}</p>
                    <p class="context">${work.context}</p>
                  </div>
                </details>
                <details class="notes">
                  <summary>Notes & Response <i>+</i></summary>
                  <div>
                    <p class="response">${work.response}</p>
                  </div>
                </details>
                <details class="terms">
                  <summary>Key Terms <i>+</i></summary>
                  <div></div>
                </details>
                <details class="connection">
                  <summary>Connections <i>+</i></summary>
                  <p class="con-det">Connection Type (influence, response, application).</p>
                  <div></div>
                </details>
              </div>
            `;
            sections[work.section].appendChild(entry);

            const target = location.hash.slice(1);

            if (target) {
              const entry = document.getElementById(target);
              if (entry instanceof HTMLDetailsElement) {
                entry.open = true;
                entry.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            }

            const termsContainer = entry.querySelector(".terms div");

            work.terms.forEach((term) => {
              const span = document.createElement("span");
              span.textContent = term;
              termsContainer.appendChild(span);
            });

            const connectionContainer = entry.querySelector(".connection div");

            work.connection.forEach((connection) => {
              const a = document.createElement("a");
              connectionContainer.appendChild(a);
              a.href = `#${connection}`;

              a.innerHTML = `
                <span>${works[connection].title} <span>${works[connection].year}</span></span>
              `;
            });
          });

        initSearch();
      })();

      function initSearch() {
        const searchInput = document.querySelector(
          'input[type="search"][name="filter"]',
        );
        const cards = document.querySelectorAll("article .card");
        if (!searchInput) return;

        const form = searchInput.closest("form");
        if (form) {
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            applyFilter();
          });
          form.addEventListener("reset", () => {
            cards.forEach((card) => {
              card.style.display = "";
            });
          });
        }

        const applyFilter = () => {
          const cleanedInput = searchInput.value
            .replace(/[#,\s]+/g, " ")
            .toLowerCase();
          const rawTokens = cleanedInput
            .split(" ")
            .filter((token) => token.trim() !== "" && token !== "-");
          const includeTokens = [];
          const excludeTokens = [];
          rawTokens.forEach((token) => {
            if (token.startsWith("-") && token.length > 1) {
              excludeTokens.push(token.slice(1));
            } else {
              includeTokens.push(token);
            }
          });
          cards.forEach((card) => {
            const text = card.textContent.toLowerCase();
            const tags = (card.dataset.tags || "").toLowerCase();
            const combined = `${text} ${tags}`;
            const includesAll = includeTokens.every((token) =>
              combined.includes(token),
            );
            const excludesAll = excludeTokens.every(
              (token) => !combined.includes(token),
            );
            card.style.display = includesAll && excludesAll ? "" : "none";
          });
        };

        searchInput.addEventListener("input", applyFilter);
        searchInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape") searchInput.blur();
        });

        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get("q");
        if (query) {
          searchInput.value = query;
          applyFilter();
        }
      }
    </script>
  </body>
</html>
